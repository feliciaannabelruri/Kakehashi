<title>Kakehashi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap">
<style>
  :root{
    --bg:#FAFAF8; --panel:#fff; --panel-2:#F0EEE8; --line:#ECEAE4;
    --ink:#14181F; --ink-soft:#4B4B4B; --muted:#8A8F98;
    --accent:#2A5CF0; --accent-2:#1E3A8A;
    --mot:#1B8F72; --mot-bg:#E6F4EF;
    --omo:#B9812F; --omo-bg:#F7EFDF;
    --stp:#C0402E; --stp-bg:#F7E6E2;
    --rak:#BF0000; --rak-bg:#FCE6E6;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#111417; --panel:#181C21; --panel-2:#1F242A; --line:#2A2F35;
      --ink:#EDEAE2; --ink-soft:#C7C2B8; --muted:#8B8F97;
      --mot-bg:#122A22; --omo-bg:#2B2214; --stp-bg:#2B1712; --rak-bg:#2B1213;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111417; --panel:#181C21; --panel-2:#1F242A; --line:#2A2F35;
    --ink:#EDEAE2; --ink-soft:#C7C2B8; --muted:#8B8F97;
    --mot-bg:#122A22; --omo-bg:#2B2214; --stp-bg:#2B1712; --rak-bg:#2B1213;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit}
  img{display:block}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  a{color:var(--accent)} a:hover{color:var(--accent-2)}

  .shell{display:flex;min-height:100vh}
  .sidenav{display:none}
  .bottomnav{display:flex}
  @media (min-width:900px){
    .shell{max-width:1440px;margin:0 auto}
    .sidenav{display:flex}
    .bottomnav{display:none}
  }

  .sidenav{width:236px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);flex-direction:column;padding:24px 16px;position:sticky;top:0;height:100vh;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px;}
  .brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 auto;}
  .brand .name{font-size:15px;font-weight:800;letter-spacing:-0.01em;}
  .rolepill{display:flex;gap:3px;background:var(--panel-2);border-radius:11px;padding:3px;margin-top:18px;}
  .rolepill button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:8px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--muted);}
  .rolepill button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .navlist{display:flex;flex-direction:column;gap:2px;margin-top:16px;}
  .navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;border:0;background:transparent;cursor:pointer;text-align:left;width:100%;color:var(--muted);font-size:13px;font-weight:500;}
  .navitem svg{flex:0 0 auto}
  .navitem.on{background:var(--panel-2);color:var(--ink);font-weight:700;}
  .navcta{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 0;font-size:13px;font-weight:700;cursor:pointer;}
  .navprofile{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--panel-2);cursor:pointer;border:0;text-align:left;width:100%;}
  .navprofile img{width:32px;height:32px;border-radius:10px;object-fit:cover;}

  .bottomnav{position:fixed;left:0;right:0;bottom:0;height:78px;background:var(--panel);border-top:1px solid var(--line);align-items:center;padding:0 8px;z-index:15;}
  .bnitem{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:8px 0;color:var(--muted);font-size:9.5px;font-weight:500;}
  .bnitem.on{color:var(--accent);font-weight:700;}
  .bnfab{flex:0 0 auto;width:52px;height:52px;border-radius:16px;background:var(--accent);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0 6px;box-shadow:0 8px 18px -6px rgba(42,92,240,.55);}
  .bnfab:disabled{opacity:.4;cursor:not-allowed;}

  .main{flex:1;min-width:0;}
  .topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:24px 20px 0;}
  @media (min-width:900px){.topbar{padding:28px 36px 0;}}
  .who{display:flex;align-items:center;gap:11px;flex:1 1 200px;background:none;border:0;cursor:pointer;text-align:left;padding:2px;}
  .who img{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:0 0 auto;}
  .who .g{font-size:12px;color:var(--muted);font-weight:500;}
  .who .n{font-size:15px;font-weight:800;color:var(--ink);}
  .searchwrap{display:flex;align-items:center;gap:8px;flex:2 1 220px;}
  .search{flex:1;display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;}
  .search span{font-size:13px;color:var(--muted);}
  .topbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex:0 0 auto;color:var(--ink);}
  .topbtn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--stp);border:1.5px solid var(--panel);}
  .roleswitch{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 13px;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--ink);flex:0 0 auto;}
  .roleswitch svg{flex:0 0 auto}

  .content{padding:20px;max-width:1180px;}
  @media (min-width:900px){.content{padding:24px 36px 48px;}}
  .content.mobile-pad{padding-bottom:96px;}

  .h1{font-size:19px;font-weight:800;}
  @media (min-width:900px){.h1{font-size:22px;}}
  .sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .backrow{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .backbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);}

  .pills{display:flex;gap:8px;overflow-x:auto;padding:16px 0 2px;}
  .pill{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-size:12.5px;font-weight:600;cursor:pointer;}
  .pill.on{color:#fff;background:var(--accent);border-color:var(--accent);}
  .pill.on.mot{background:var(--mot);border-color:var(--mot);color:#fff}
  .pill.on.omo{background:var(--omo);border-color:var(--omo);color:#fff}
  .pill.on.stp{background:var(--stp);border-color:var(--stp);color:#fff}
  .pill.on.rak{background:var(--rak);border-color:var(--rak);color:#fff}

  .promo{margin-top:16px;border-radius:18px;padding:22px;position:relative;overflow:hidden;min-height:140px;display:flex;align-items:center;cursor:pointer;border:0;text-align:left;width:100%;}
  .promo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .promo .scrim{position:absolute;inset:0;background:linear-gradient(120deg,rgba(15,26,74,.88) 10%,rgba(42,92,240,.7) 100%);}
  .promo .txt{position:relative;color:#fff;}
  .promo .kick{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#DCE6FF;}
  .promo .head{font-size:18px;font-weight:800;margin-top:6px;line-height:1.25;max-width:260px;}
  .promo .cta{margin-top:14px;background:#fff;color:var(--accent);border:0;border-radius:10px;padding:10px 16px;font-size:12.5px;font-weight:700;display:inline-block;}

  .homehero{display:block;}
  @media (min-width:900px){.homehero{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:stretch;}}
  .minicard{display:none;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;flex-direction:column;justify-content:center;}
  @media (min-width:900px){.minicard{display:flex;}}
  .minicard .k{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .minicard .v{font-size:26px;font-weight:800;margin-top:6px;}
  .minicard .d{font-size:12px;color:var(--muted);margin-top:4px;}

  .toggles{display:flex;align-items:center;justify-content:space-between;margin-top:22px;flex-wrap:wrap;gap:12px;}
  .seg{display:flex;gap:6px;background:var(--panel-2);border-radius:12px;padding:4px;}
  .seg button{padding:8px 15px;border:0;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted);}
  .seg button.on{background:var(--panel);color:var(--ink);}

  .sectionhead{display:flex;align-items:baseline;justify-content:space-between;margin-top:22px;}
  .sectionhead .t{font-size:15px;font-weight:800;}
  @media (min-width:900px){.sectionhead .t{font-size:16px;}}
  .sectionhead button{background:none;border:0;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;}

  .reward-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px;}
  @media (min-width:640px){.reward-grid{grid-template-columns:repeat(2,1fr);}}
  @media (min-width:900px){.reward-grid{grid-template-columns:repeat(3,1fr);gap:14px;}}
  .rcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;border-width:1px;border-style:solid;padding:0;font:inherit;color:inherit;transition:transform .12s,box-shadow .12s;}
  .rcard:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(20,24,31,.25);}
  .rcard .ph{position:relative;height:118px;}
  .rcard .ph img{width:100%;height:100%;object-fit:cover;}
  .rcard .ph .tint{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.16;}
  .rcard .ph .tag{position:absolute;left:9px;bottom:9px;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.94);}
  .rcard .ph .heart{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.94);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .rcard .body{padding:13px 14px 15px;}
  .rcard .ti{font-size:13.5px;font-weight:700;line-height:1.3;}
  .rcard .me{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .rcard .pt{display:flex;justify-content:flex-end;margin-top:9px;font-size:12.5px;font-weight:800;color:var(--accent);}

  .modecard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:12px;display:flex;flex-direction:column;}
  .modes-grid{display:block;}
  @media (min-width:900px){.modes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}.modecard{margin-top:0;height:100%;}}
  .modeicon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
  .modecard .mt{font-size:16px;font-weight:800;margin-top:14px;}
  .modecard .md{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.6;flex:1;}
  .modecard button{margin-top:16px;border:0;border-radius:11px;padding:12px 0;font-size:13px;font-weight:700;cursor:pointer;color:#fff;}
  .rakbanner{background:var(--ink);color:#fff;border-radius:18px;padding:20px;margin-top:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .rakbanner .badge{width:36px;height:36px;border-radius:50%;border:1.6px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:0 0 auto;}
  .rakbanner .tt{font-size:13.5px;font-weight:700;}
  .rakbanner .dd{font-size:12px;color:#A9AFBA;margin-top:4px;}
  .rakbanner button{background:#fff;border:0;color:var(--ink);font-size:12.5px;font-weight:700;cursor:pointer;padding:10px 16px;border-radius:10px;margin-left:auto;}

  .wallet-top{display:block;}
  @media (min-width:720px){.wallet-top{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}}
  .tokencard{border-radius:20px;padding:24px;position:relative;overflow:hidden;background:linear-gradient(120deg,var(--accent) 0%,var(--accent-2) 100%);}
  .tokencard .k{color:#DCE6FF;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
  .tokencard .v{color:#fff;font-size:34px;font-weight:800;margin-top:6px;}
  .tokencard button{margin-top:16px;background:#fff;color:var(--accent);border:0;border-radius:11px;padding:11px 18px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;}
  .stampcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:16px;}
  @media (min-width:720px){.stampcard{margin-top:0;}}
  .stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px;}
  .stamp{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:1.6px dashed var(--line);color:var(--muted);}
  .stamp.filled{border-style:solid;border-color:var(--accent);background:var(--accent);color:#fff;}

  .hist{display:flex;flex-direction:column;gap:9px;margin-top:12px;max-width:640px;}
  .hrow{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;}
  .hrow .ic{width:38px;height:38px;border-radius:11px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .hrow .m{flex:1;min-width:0;}
  .hrow .m .t{font-size:12.5px;font-weight:700;}
  .hrow .m .s{font-size:11px;color:var(--muted);margin-top:2px;}
  .hrow .p{font-size:12.5px;font-weight:800;color:var(--mot);}
  .hrow .p.neg{color:var(--ink-soft);}
  .empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:12.5px;background:var(--panel);border:1px dashed var(--line);border-radius:14px;}

  .bizchips{display:flex;gap:7px;overflow-x:auto;margin-top:18px;padding-bottom:2px;}
  .bizchip{flex:0 0 auto;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;}
  .bizchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}

  .stat4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px;max-width:900px;}
  @media (min-width:640px){.stat4{grid-template-columns:repeat(4,1fr);}}
  .stattile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;}
  .stattile .v{font-size:20px;font-weight:800;color:var(--accent);}
  .stattile .l{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.4;}

  .heroband{position:relative;border-radius:16px;overflow:hidden;height:140px;max-width:1100px;display:flex;align-items:flex-end;padding:20px;margin-top:4px;}
  .heroband img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .heroband .scrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,24,31,.82) 0%,rgba(20,24,31,.15) 70%);}
  .heroband .tx{position:relative;color:#fff;font-size:16px;font-weight:800;max-width:520px;line-height:1.4;}

  .biz2{display:block;max-width:1100px;}
  @media (min-width:720px){.biz2{display:grid;grid-template-columns:1fr 1fr;gap:24px;}}
  .cmptable{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px;}
  .cmprow{display:grid;grid-template-columns:1fr 1fr 1fr;padding:11px 14px;border-top:1px solid var(--line);font-size:11.5px;}
  .cmprow:first-child{border-top:0;background:var(--panel-2);font-weight:700;color:var(--muted);font-size:10.5px;}
  .cmprow .l{color:var(--ink-soft);font-weight:600;}
  .cmprow .r{color:var(--muted);}
  .cmprow .k{color:var(--mot);font-weight:600;}
  .biz-bullets{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .bul{display:flex;gap:9px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:12.5px;color:var(--ink-soft);line-height:1.55;}
  .bul .d{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:6px;flex:0 0 auto;}

  .rev-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px;max-width:1100px;}
  @media (min-width:640px){.rev-grid{grid-template-columns:repeat(2,1fr);}}
  @media (min-width:900px){.rev-grid{grid-template-columns:repeat(4,1fr);}}
  .revcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .revcard .t{font-size:12.5px;font-weight:700;}
  .revcard .vv{font-size:18px;font-weight:800;color:var(--accent);margin-top:7px;}
  .revcard .u{font-size:11px;color:var(--muted);}
  .revcard .d{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5;}
  .darkcard{background:var(--ink);border-radius:14px;padding:18px;margin-top:14px;max-width:1100px;color:var(--bg);}
  .darkcard .t{font-size:13px;font-weight:700;}
  .darkcard .d{font-size:12px;color:#A9AFBA;margin-top:6px;line-height:1.6;}

  .market2{display:block;max-width:1100px;}
  @media (min-width:720px){.market2{display:grid;grid-template-columns:1fr 1fr;gap:24px;}}
  .msizerow{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:9px;}
  .msizerow .k{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .msizerow .d{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .msizerow .v{font-size:19px;font-weight:800;color:var(--accent);}
  .uecon{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px;}
  @media (min-width:720px){.uecon{margin-top:0;}}
  .uetile{background:var(--panel-2);border-radius:14px;padding:14px;}
  .uetile .v{font-size:18px;font-weight:800;}
  .uetile .l{font-size:11px;color:var(--muted);margin-top:4px;}

  .adopt2{display:block;max-width:1100px;}
  @media (min-width:720px){.adopt2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}}
  .adoptcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px;}
  @media (min-width:720px){.adoptcard{margin-top:0;}}
  .adoptcard .h{font-size:13px;font-weight:800;}
  .adoptcard .row{display:flex;gap:9px;font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-top:10px;}
  .loops{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .loops span{font-size:11.5px;font-weight:600;padding:8px 13px;border-radius:9px;background:var(--panel-2);}

  .phase-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px;max-width:1100px;}
  @media (min-width:720px){.phase-grid{grid-template-columns:repeat(3,1fr);}}
  .phasecard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;}
  .phasecard .top{display:flex;align-items:baseline;justify-content:space-between;}
  .phasecard .n{font-size:10.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;}
  .phasecard .w{font-size:11px;color:var(--muted);}
  .phasecard .t{font-size:15px;font-weight:800;margin-top:6px;}
  .phasecard .stats{display:flex;gap:18px;margin-top:12px;}
  .phasecard .stats div div:first-child{font-size:10px;color:var(--muted);}
  .phasecard .stats div div:last-child{font-size:12.5px;font-weight:700;margin-top:2px;}
  .phasecard .ms{font-size:11.5px;color:var(--muted);margin-top:10px;}

  .scale-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px;max-width:1100px;}
  @media (min-width:640px){.scale-grid{grid-template-columns:repeat(2,1fr);}}
  @media (min-width:900px){.scale-grid{grid-template-columns:repeat(4,1fr);}}
  .scard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;}
  .scard .top{display:flex;align-items:baseline;justify-content:space-between;}

function fmtTime(s){var m=Math.floor(s/60),r=s%60;return m+":"+(r<10?"0":"")+r;}
function buildQR(seed){
  var n=144,h=0;for(var i=0;i<seed.length;i++){h=(h*131+seed.charCodeAt(i))>>>0;}
  function rnd(){h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0;return h/4294967296;}
  var out=[];for(var k=0;k<n;k++){out.push(rnd()>0.55);}return out;
}
var QR_CELLS=buildQR("kakehashi-pay-2026");

function toast(msg){
  var t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},2200);
}

/* ---------------- actions ---------------- */
function switchRole(){
  state.role = state.role==="customer" ? "merchant" : "customer";
  state.tab = state.role==="customer" ? "home" : "dashboard";
  render();
}
function setTab(t){state.tab=t;render();}
function setCategory(c){state.category=c;state.showAll=false;render();}
function setFeed(f){state.feed=f;render();}
function toggleSaved(id){state.saved[id]=!state.saved[id];render();}
function openDetail(id){state.detailId=id;render();}
function closeDetail(){state.detailId=null;render();}
function addDetailToWallet(){
  var item=CATALOG.filter(function(c){return c.id===state.detailId;})[0];
  if(!item)return;
  state.tokenBalance+=item.pts;
  state.history.unshift({title:item.title,merchant:item.merchant,pts:item.pts,when:"just now"});
  state.detailId=null;render();toast("Added to wallet");
}
function cyclePersona(field){
  var i=PERSONA_ORDER.indexOf(state[field]);
  state[field]=PERSONA_ORDER[(i+1)%3];render();
}

function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function startTimer(){
  stopTimer();
  timer=setInterval(function(){
    state.qrSeconds--;
    if(state.qrSeconds<=0){stopTimer();closeFlow();toast("Code expired — try again");return;}
    var el=$("#qrTime");if(el)el.textContent="Refreshes in "+fmtTime(state.qrSeconds);
  },1000);
}
function openFlow(kind,mode){
  state.flow=kind;
  state.flowStep = kind==="sale" ? -1 : 0;
  state.flowMode = mode || (state.category!=="all"&&state.category!=="rakuten"?state.category:"mottainai");
  state.flowAmount="700";
  state.flowPersona="student";
  render();
  if(kind==="pay"){state.qrSeconds=300;startTimer();}
}
function closeFlow(){
  stopTimer();if(scanT1)clearTimeout(scanT1);if(scanT2)clearTimeout(scanT2);
  state.flow=null;state.flowStep=0;render();
}
function saleKey(k){
  if(k==="C")state.flowAmount="0";
  else if(k==="back")state.flowAmount=state.flowAmount.slice(0,-1)||"0";
  else state.flowAmount=(state.flowAmount==="0"?"":state.flowAmount)+k;
  render();
}
function saleGenerate(){state.flowStep=0;state.qrSeconds=300;render();startTimer();}
function simScan(){
  stopTimer();state.flowStep=1;render();
  scanT1=setTimeout(function(){state.flowStep=2;render();
    scanT2=setTimeout(function(){state.flowStep=3;render();},1300);
  },1100);
}
function completeFlow(){
  var persona = state.flow==="sale" ? state.flowPersona : state.persona;
  var r=REWARDS[state.flowMode][persona];
  if(state.flow==="pay"){
    state.tokenBalance+=r.pts;
    if(state.flowMode==="stamp"&&state.stamps<5)state.stamps++;
    state.history.unshift({title:r.title,merchant:MODE_LABEL[state.flowMode],pts:r.pts,when:"just now"});
    toast("Reward added to wallet");
  } else {
    state.merchantStats.covers++;
    state.merchantStats.revenue+=parseInt(state.flowAmount||"0",10);
    if(state.flowMode==="mottainai")state.merchantStats.surplus++;
    state.merchantStats.profiles++;
    state.merchantSales.unshift({amount:state.flowAmount,customer:PERSONAS[persona].name,mode:state.flowMode,pts:r.pts,when:"just now"});
    toast("Sale complete");
  }
  state.flow=null;state.flowStep=0;render();
}

    '<button class="scanbtn" data-generate>Generate QR for customer</button>';
  } else if(state.flowStep===0){
    var qr=QR_CELLS.map(function(v){return '<div style="background:'+(v?"var(--ink)":"#fff")+'"></div>';}).join("");
    body='<div class="qrbox"><div class="qrgrid">'+qr+'</div></div>'+
    '<div class="qrtime" id="qrTime">Refreshes in '+fmtTime(state.qrSeconds)+'</div>';
    if(isSale){
      body+='<div class="personarow">'+PERSONA_ORDER.map(function(k){
        return '<button class="'+(state.flowPersona===k?"on":"")+'" data-flowpersona="'+k+'">'+PERSONAS[k].name+'</button>';
      }).join("")+'</div>';
    } else {
      body+='<button class="personabtn" data-cyclepersona><span style="font-size:12px;color:var(--muted);">Paying as</span><span style="font-size:12.5px;font-weight:700;">'+p.name+'</span>'+
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A8F98" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg></button>';
    }
    body+='<button class="scanbtn" data-scan>Simulate '+(isSale?"customer":"merchant")+' scan</button>';
  } else if(state.flowStep===1){
    body='<div class="scanframe"><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span><div class="scanline"></div></div>'+
    '<div style="font-size:13px;font-weight:700;margin-top:18px;">Reading payment&hellip;</div>';
  } else if(state.flowStep===2){
    body='<div class="matchicon"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg></div>'+
    '<div style="font-size:14px;font-weight:800;margin-top:16px;">Matching '+(isSale?"a reward for "+p.name:"your reward")+'</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;width:100%;">'+
    '<div class="matchrow"><span style="color:var(--muted);">Preference</span><span style="font-weight:700;">'+p.affinity+'</span></div>'+
    '<div class="matchrow"><span style="color:var(--muted);">Merchant goal</span><span style="font-weight:700;">'+MODE_GOAL[state.flowMode]+'</span></div>'+
    '<div class="matchrow"><span style="color:var(--muted);">Conversion odds</span><span style="font-weight:700;">'+(persona==="tourist"?"58%":"66%")+'</span></div></div>';
  } else {
    body='<div class="rewardtop" style="background:'+MODE_ACCENT[state.flowMode]+'"><div style="font-size:11px;font-weight:700;opacity:.85;letter-spacing:.05em;text-transform:uppercase;">+'+reward.pts+' Kakehashi Token</div>'+
    '<div style="font-size:18px;font-weight:800;margin-top:6px;line-height:1.3;">'+reward.title+'</div><div style="font-size:12px;opacity:.85;margin-top:4px;">'+reward.sub+'</div></div>'+
    '<div class="rewardbody">'+(isSale?p.name+" pays ¥"+state.flowAmount+". "+reward.why:reward.why)+'</div>'+
    '<div class="rakline"><span style="width:20px;height:20px;border-radius:50%;background:var(--rak-bg);color:var(--rak);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;">R</span>+500 Rakuten Points included</div>'+
    '<button class="redeembtn" data-complete>'+(isSale?"Done":"Add to wallet")+'</button>';
  }
  return '<div class="modal-overlay" id="flowOverlay"><div class="modal-card"><div class="modal-head"><div class="t">'+title+'</div>'+
    '<button class="xbtn" data-closeflow><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>'+
    '<div class="modal-body">'+body+'</div></div></div>';
}

/* ---------------- render: landing ---------------- */

  state.view="app";state.role=role;state.tab=role==="customer"?"home":"dashboard";
  render();window.scrollTo({top:0,behavior:"smooth"});
}

    '<div class="ltags"><span>B2B SaaS</span><span>AI</span><span>F&amp;B</span><span>Tourism</span><span>ESG</span></div></div></header>'+

/* ---------------- master render ---------------- */
function renderContent(){
  if(state.role==="customer"){
    if(state.tab==="home")return renderHome();
    if(state.tab==="modes")return renderModes();
    if(state.tab==="wallet")return renderWallet();
    if(state.tab==="company")return renderCompany();
    if(state.tab==="profile")return renderProfileCustomer();
  } else {
    if(state.tab==="dashboard"||state.tab==="dashboardPromo")return renderDashboard();
    if(state.tab==="campaigns")return renderCampaigns();
    if(state.tab==="company")return renderCompany();
    if(state.tab==="profile")return renderProfileMerchant();
  }
  return "";
}
function render(){
  if(state.view==="landing"){
    $("#appRoot").hidden=true;
    $("#landingRoot").innerHTML=renderLanding();
    $("#modalRoot").innerHTML="";
    return;
  }
  $("#appRoot").hidden=false;
  $("#landingRoot").innerHTML="";
  renderNav();
  $("#content").innerHTML='<div class="kh-in">'+renderContent()+'</div>';
  $("#modalRoot").innerHTML=renderDetailModal()+renderFlowModal();
}

/* ---------------- events ---------------- */
document.addEventListener("click",function(e){
  var t;
  if((t=e.target.closest("[data-launch]"))){launchApp(t.dataset.launch);return;}
  if((t=e.target.closest("#brandBack"))){exitToLanding();return;}
  if((t=e.target.closest("#exitToLandingBtn"))){exitToLanding();return;}
  if((t=e.target.closest("[data-role]"))){ if(t.dataset.role!==state.role) switchRole(); return; }
  if((t=e.target.closest("#roleSwitchBtn"))){ switchRole(); return; }
  if((t=e.target.closest("#roleSwitchInline"))){ switchRole(); return; }
  if((t=e.target.closest("[data-tab]"))){ var tb=t.dataset.tab; setTab(tb==="dashboardPromo"?"dashboard":tb); if(tb==="dashboardPromo"&&state.role==="customer"){switchRole();} return; }
  if((t=e.target.closest("[data-cat]"))){setCategory(t.dataset.cat);return;}
  if((t=e.target.closest("[data-feed]"))){setFeed(t.dataset.feed);return;}
  if((t=e.target.closest("[data-showall]"))){state.showAll=!state.showAll;render();return;}
  if((t=e.target.closest("[data-save]"))){e.stopPropagation();toggleSaved(t.dataset.save);return;}
  if((t=e.target.closest("[data-detail]"))){openDetail(t.dataset.detail);return;}
  if((t=e.target.closest("[data-closedetail]"))){closeDetail();return;}
  if(e.target.id==="detailOverlay"){closeDetail();return;}
  if((t=e.target.closest("[data-adddetail]"))){addDetailToWallet();return;}
  if((t=e.target.closest("[data-demo]"))){openFlow("pay",t.dataset.demo);return;}
  if((t=e.target.closest("#bnPay"))){ if(!t.disabled) openFlow(state.role==="customer"?"pay":"sale"); return; }
  if((t=e.target.closest("#sideCta"))){ if(!t.disabled) openFlow(state.role==="customer"?"pay":"sale"); return; }
  if((t=e.target.closest("#dashSaleBtn"))){openFlow("sale");return;}
  if((t=e.target.closest("[data-pay]"))){openFlow("pay");return;}
  if((t=e.target.closest("[data-go]"))){setTab(t.dataset.go);if(t.dataset.biz)setBiz(t.dataset.biz);return;}
  if((t=e.target.closest("[data-biz]")) && !e.target.closest("[data-go]")){setBiz(t.dataset.biz);return;}
  if((t=e.target.closest("[data-cyclepersona]"))){cyclePersona("persona");return;}
  if((t=e.target.closest("[data-flowpersona]"))){state.flowPersona=t.dataset.flowpersona;render();return;}
  if((t=e.target.closest("[data-flowmode]"))){state.flowMode=t.dataset.flowmode;render();return;}
  if((t=e.target.closest("[data-saleKey]"))){saleKey(t.dataset.salekey===undefined?t.getAttribute("data-saleKey"):t.dataset.salekey);return;}
  if((t=e.target.closest("[data-generate]"))){saleGenerate();return;}
  if((t=e.target.closest("[data-scan]"))){simScan();return;}
  if((t=e.target.closest("[data-closeflow]"))){closeFlow();return;}
  if(e.target.id==="flowOverlay"){closeFlow();return;}
  if((t=e.target.closest("[data-complete]"))){completeFlow();return;}
  if((t=e.target.closest("[data-obcat]"))){obSetCat(t.dataset.obcat);return;}
  if((t=e.target.closest("[data-obtier]"))){obSetTier(t.dataset.obtier);return;}
  if((t=e.target.closest("[data-obmode]"))){obToggleMode(t.dataset.obmode);return;}
  if((t=e.target.closest("[data-obnext]"))){obNext();return;}
  if((t=e.target.closest("[data-obback]"))){obBack();return;}
  if((t=e.target.closest("#goLiveBtn"))){goLive();return;}
  if((t=e.target.closest("[data-campaign]"))){toggleCampaign(t.dataset.campaign);return;}
});

render();
})();
</script>
